<div class="auth-page">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="entrar()">
    <h1>Entrar</h1>

    @if (erro()) {
      <p class="error-message">{{ erro() }}</p>
    }

    <div class="form-group">
      <label for="email">E-mail</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    </div>

    <button type="submit" class="btn-primary" [disabled]="carregando()">
      {{ carregando() ? 'Entrando...' : 'Entrar' }}
    </button>

    <p class="switch-link">Ainda não tem conta? <a routerLink="/registro">Criar conta</a></p>
  </form>
</div>
