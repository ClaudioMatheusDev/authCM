<div class="auth-page">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="registrar()">
    <h1>Criar conta</h1>

    @if (erro()) {
      <p class="error-message">{{ erro() }}</p>
    }

    <div class="form-group">
      <label for="nome">Nome</label>
      <input id="nome" type="text" formControlName="nome" autocomplete="name" />
    </div>

    <div class="form-group">
      <label for="dataNascimento">Data de nascimento</label>
      <input id="dataNascimento" type="date" formControlName="dataNascimento" />
    </div>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
    </div>

    <div class="form-group">
      <label for="documento">Documento</label>
      <input id="documento" type="text" formControlName="documento" placeholder="CPF" />
    </div>

    <div class="form-group">
      <label for="telefone">Telefone</label>
      <input id="telefone" type="text" formControlName="telefone" />
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password" />
      <small>Mínimo 8 caracteres, com maiúscula, número e um caractere especial.</small>
    </div>

    <button type="submit" class="btn-primary" [disabled]="carregando()">
      {{ carregando() ? 'Criando conta...' : 'Criar conta' }}
    </button>

    <p class="switch-link">Já tem conta? <a routerLink="/login">Entrar</a></p>
  </form>
</div>
